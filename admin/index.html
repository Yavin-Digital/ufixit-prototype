<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" /><title>Sign in · Demo admin · U-FIX-IT Appliance Parts</title>
<link rel="icon" href="../img/favicon-192.png" sizes="192x192" /><link rel="stylesheet" href="../css/fonts.css" /><link rel="stylesheet" href="../css/site.css" /><link rel="stylesheet" href="admin.css" /></head>
<body class="adm" data-page="signin"><div class="demo-bar">Demo admin · Sample data only · Not connected to any store system</div>
<header class="ah"><a class="ah__logo" href="../index.html" aria-label="Back to the U-FIX-IT store"><img src="../img/logo-admin.webp" alt="U-FIX-IT Appliance Parts" width="84" height="42" /></a><div class="ah__t">Store admin<small>Demo</small></div></header>
<main class="signin" id="main"><div class="panel"><h1>Sign in</h1>
<p class="note"><b>Demo sign-in.</b> Any email and password will work. Nothing is checked or stored, and every number inside is sample data.</p>
<form id="sf"><div class="fld"><label for="em">Email</label><input id="em" type="email" autocomplete="username" value="manager@example.com" required /></div>
<div class="fld"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" value="demo" required /></div>
<button class="btn red" type="submit" style="width:100%">Sign in to demo</button></form>
<p style="margin:16px 0 0"><a href="../index.html">Back to the store</a></p></div></main>
<script>document.getElementById('sf').addEventListener('submit',function(e){e.preventDefault();sessionStorage.setItem('ufx_admin_demo','1');location.href='dashboard.html'})</script></body></html>
